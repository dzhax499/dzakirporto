            <h2>From transactions to notifications.</h2>
            <p>CashFlow helps a client monitor incoming QRIS payments and balance payouts through Telegram. Notifications include the transaction type, amount, time in Western Indonesian Time, status, and reference in one conversation.</p>

      function fallbackImage(imgEl) {
        imgEl.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">' +
          '<rect width="100%" height="100%" fill="#222"/>' +
          '<text x="50%" y="50%" fill="#888" font-family="Arial,Helvetica,sans-serif" font-size="24" text-anchor="middle" dominant-baseline="middle">Image Not Available</text>' +
          '</svg>'
        );
      }

      function populate() {
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const data = PROJECTS[id];
        const img = document.getElementById('pd-image');
        const title = document.getElementById('pd-title');
        const desc = document.getElementById('pd-desc');
        const tech = document.getElementById('pd-tech');
        const docs = document.getElementById('pd-doc-content');
        const sourceBtn = document.getElementById('pd-source-btn');
        const sourceNote = document.getElementById('pd-source-note');
        sourceNote.hidden = true;
        sourceNote.textContent = '';
        const readmeInfo = document.getElementById('pd-readme-info');

        const currentLang = document.documentElement.lang === 'en' ? 'en' : 'id';
        if (!data) {
          title.textContent = currentLang === 'id' ? 'Projek tidak ditemukan' : 'Project not found';
          desc.textContent = currentLang === 'id' ? 'Projek yang diminta belum ada.' : 'The requested project does not exist yet.';
          sourceBtn.style.display = 'none';
          fallbackImage(img);
          return;
        }

        title.textContent = currentLang === 'id' ? data.title : (data.title_en || data.title);
        document.title = title.textContent + ' — Dzakir Tsabit';
        img.alt = title.textContent;
        desc.textContent = currentLang === 'id' ? data.desc : (data.desc_en || data.desc);
        img.src = data.image || '';
        img.onerror = () => fallbackImage(img);

        if (data.github_repo) {
          sourceBtn.href = data.github_repo;
          sourceBtn.style.display = 'inline-block';
        } else {
          sourceBtn.style.display = 'none';
          if (data.source_note) {
            sourceNote.textContent = currentLang === 'en' ? (data.source_note_en || data.source_note) : data.source_note;
            sourceNote.hidden = false;
          }
        }

        tech.innerHTML = '';
        (data.tech || []).forEach(t => {
          const s = document.createElement('span');
          s.className = 'tech-tag';
          s.textContent = t;
          tech.appendChild(s);
        });

        if (data.github_readme || data.raw_markdown) {
          readmeInfo.style.display = 'block';
        } else {
          readmeInfo.style.display = 'none';
        }

        docs.innerHTML = (currentLang === 'en' ? (data.docs_en || data.docs) : data.docs) || '<p>No documentation yet.</p>';

        if (data.github_readme) {
          fetch(data.github_readme)
            .then(res => {
              if (!res.ok) throw new Error('Network response was not ok');
              return res.text();
            })
            .then(text => {
              // Parse markdown correctly using marked.js
              const html = marked.parse(text);
              docs.innerHTML = '<div class="markdown-content">' + html + '</div>';
            })
            .catch(err => {
              docs.innerHTML = '<p>Dokumentasi README belum tersedia atau repositori private.</p>';
            });
        } else if (data.raw_markdown) {
          const html = marked.parse(data.raw_markdown);
          docs.innerHTML = '<div class="markdown-content">' + html + '</div>';
        }
      }

      populate();

      document.addEventListener('langChanged', (e) => {
        populate();
      });
